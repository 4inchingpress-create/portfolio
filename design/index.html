<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="description" content="직접 지은 책들의 책장.">
<meta property="og:type" content="website">
<meta property="og:title" content="book design — 아침의 북디자인">
<meta property="og:description" content="직접 지은 책들의 책장.">
<meta property="og:url" content="https://4inchingpress-create.github.io/portfolio/design/">
<meta property="og:image" content="https://4inchingpress-create.github.io/portfolio/og.png">
<meta name="twitter:card" content="summary_large_image">
<title>book design — 4inching press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Nanum+Myeongjo&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "SeMyungjo";
    src: local("SM세명조"), local("SMSeMyungJo"), local("SMSeMyungJo-Regular"),
         local("SM SeMyungJo Std"), local("SMSeMyungJoStd-Regular"),
         url("../fonts/SMSeMyungJo.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --bg: #070303; --text: #EEEAE2; --dim: #4A4540; --muted: #8C877F;
    --paper: #FBF8F1; --ink: #1A1A1A;
    --serif: "SeMyungjo", "EB Garamond", "Nanum Myeongjo", serif;
    /* 책장 높이: 250mm 책이 이 높이. 1mm = --k */
    --shelf: min(52vh, 520px);
    --k: calc(var(--shelf) / 255);
    /* 앞표지로 꺼낸 책: --big 배까지 키우되, 높이는 --cap(mm 환산)을 넘지 않게 */
    --big: 1.9; --cap: 390;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--serif); overflow-x: hidden; }
  .stage { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .bar { display: flex; justify-content: space-between; padding: 22px 28px 0; font-size: 15px; }
  .bar a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .bar .count { color: var(--muted); }
  .bar .count:hover { color: var(--text); }
  .filters { padding: 14px 28px 0; font-size: clamp(28px, 3.8vw, 58px); line-height: 1.12; letter-spacing: -.01em; }
  .filters button { color: var(--dim); transition: color .2s; }
  .filters button:hover { color: #9D978D; }
  .filters button[aria-pressed="true"] { color: var(--text); }
  .filters .sep { color: var(--dim); margin-right: .25em; }

  /* 책장 */
  .shelf-wrap { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 0 26px; }
  .shelf {
    position: relative;
    display: flex; align-items: flex-end;
    gap: calc(var(--k) * 1.2);
    padding: 30px 28px 0;
    overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth;
  }
  .shelf::-webkit-scrollbar { display: none; }
  .shelf::before, .shelf::after { content: ""; margin: auto; } /* 책이 적을 땐 가운데 */
  .baseline { height: 1px; background: var(--text); margin: 0 28px; opacity: .85; }

  .vol {
    flex: none; position: relative;
    --s: 1;
    height: calc(var(--k) * var(--h) * var(--s));
    width: calc(var(--k) * var(--t));
    transition: width .7s cubic-bezier(.45,.05,.2,1), height .7s cubic-bezier(.45,.05,.2,1), transform .35s;
  }
  .vol.group-start { margin-left: calc(var(--k) * 14); }
  .vol.group-start:first-of-type { margin-left: 0; }
  .vol.main { --s: min(var(--big), calc(var(--cap) / var(--h))); width: calc(var(--k) * var(--w) * var(--s)); margin-left: calc(var(--k) * 12); margin-right: calc(var(--k) * 12); }
  .vol .spine, .vol .front { position: absolute; inset: 0; transition: opacity .45s; }
  .vol .spine {
    background: var(--sc); color: var(--si);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: calc(var(--k) * 7) 0 calc(var(--k) * 6);
    box-shadow: inset calc(var(--k) * 1) 0 0 rgba(255,255,255,.12), inset calc(var(--k) * -1) 0 0 rgba(0,0,0,.18);
    overflow: hidden;
  }
  .vol .spine .st {
    writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap;
    font-size: max(8px, min(calc(var(--k) * 6.2), calc(var(--k) * var(--h) * .74 / var(--len)), calc(var(--k) * var(--t) * .7)));
    line-height: 1; letter-spacing: .06em;
  }
  .vol .spine .sp { writing-mode: vertical-rl; font-size: max(7px, min(calc(var(--k) * 4.2), calc(var(--k) * var(--t) * .55))); opacity: .8; }
  .vol .front { background: #222 center / 100% 100% no-repeat; opacity: 0; pointer-events: none; box-shadow: 0 0 0 1px rgba(255,255,255,.04); }
  .vol.main .spine { opacity: 0; pointer-events: none; }
  .vol.main .front { opacity: 1; pointer-events: auto; }
  .vol:not(.main):hover { transform: translateY(calc(var(--k) * -6)); }
  .vol.main:hover { transform: translateY(calc(var(--k) * -3)); }
  .vol:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
  .vol.flat { width: calc(var(--k) * var(--w)); }
  .vol.flat .spine { opacity: 0; pointer-events: none; }
  .vol.flat .front { opacity: 1; pointer-events: auto; box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
  .vol.flat.main { width: calc(var(--k) * var(--w) * var(--s)); margin-left: calc(var(--k) * 12); margin-right: calc(var(--k) * 12); }
  /* study: 검은 행택 */
  .tagface { background: var(--tc) !important; color: var(--ti); text-align: left; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 11% 12% !important; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  .tagface::before { content: ""; position: absolute; left: 50%; top: 7%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: var(--bg); transform: translateX(-50%); z-index: 2; }
  .tagface dl { display: grid; grid-template-columns: auto 1fr; column-gap: 10%; text-align: left; row-gap: 6px; font-size: clamp(11px, calc(var(--k) * 6.4), 15px); line-height: 1.35; position: relative; z-index: 1; }
  .tagface dt { font-weight: 500; } .tagface dd { font-weight: 600; word-break: keep-all; }
  body.study-mode { --shelf: min(64vh, 640px); --k: calc(var(--shelf) / 255); }
  body.study-mode .shelf { scroll-snap-type: x mandatory; justify-content: flex-start; }
  body.study-mode .vol.tag { scroll-snap-align: center; margin-left: calc((100vw - 56px - var(--k) * var(--w)) / 2) !important; margin-right: calc((100vw - 56px - var(--k) * var(--w)) / 2) !important; }
  body.study-mode .shelf::before, body.study-mode .shelf::after { display: none; }
  .tagface .cv { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity .45s; z-index: 1; }
  .vol.tag:hover .tagface .cv, .vol.tag:focus-visible .tagface .cv { opacity: 1; }
  .vol[hidden] { display: none; }

  .caption { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 14px 28px 0; }
  .caption .ct { font-size: clamp(18px, 1.7vw, 24px); }
  .caption .cm { margin-left: 14px; font-size: 15px; color: var(--muted); }
  .caption button { font-size: 15px; border-bottom: 1px solid currentColor; padding-bottom: 2px; white-space: nowrap; }

  /* 상세: 책이 펼쳐진다 */
  .viewer { position: fixed; inset: 0; z-index: 50; background: rgba(7,3,3,.97); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .viewer.show { opacity: 1; pointer-events: auto; }
  .viewer-bar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 22px 28px; font-size: 15px; }
  .viewer-bar button:hover { text-decoration: underline; text-underline-offset: 4px; }
  .viewer-nav { display: flex; gap: 22px; }
  .vbook { position: relative; height: var(--DH); width: calc(var(--DH) * var(--w) / var(--h)); perspective: 2400px; transition: transform 1.6s cubic-bezier(.45,.05,.2,1); }
  .vbook.open { transform: translateX(50%); }
  .vpage, .vcover { position: absolute; inset: 0; }
  .vpage { background: var(--paper); color: var(--ink); container-type: size; }
  .vpage::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 10%; background: linear-gradient(90deg, rgba(0,0,0,.10), rgba(0,0,0,0)); }
  .vcover { transform-origin: left center; transform-style: preserve-3d; transition: transform 1.6s cubic-bezier(.45,.05,.2,1); }
  .vbook.open .vcover { transform: rotateY(-180deg); }
  .vbook.flat, .vbook.flat .vcover { transition: none; }
  .vface { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #222 center / 100% 100% no-repeat; transition: background-image .3s; }
  .vface.back { transform: rotateY(180deg); }
  .colophon { position: absolute; inset: 0; padding: 10cqh 9cqw 8cqh; display: flex; flex-direction: column; overflow: hidden; }
  .colophon.study { overflow-y: auto; display: block; padding-top: 8cqh; }
  .colophon.study .des { margin-top: 3cqh; font-size: max(12px, 3.6cqw); color: #6E6860; }
  .colophon.study .des b { font-weight: 400; color: #1A1A1A; font-size: 1.25em; }
  .colophon.study h2 { margin-top: 2cqh; }
  .colophon.study .memo { margin-top: 3.5cqh; }
  .colophon.study blockquote { margin-top: 3cqh; padding-left: 3cqw; border-left: 1.5px solid #1A1A1A; font-size: max(11px, 3.3cqw); line-height: 1.8; color: #3A3632; word-break: keep-all; }
  .colophon.study blockquote cite { display: block; margin-top: 1cqh; font-style: normal; color: #8C877F; }
  .colophon.study dl { margin-top: 4cqh; }
  .colophon.study .spr { margin-top: 3cqh; width: 100%; display: block; border: 1px solid #DDD7CC; }
  .colophon .no { font-size: max(10px, min(3.2cqw, 1.9cqh)); color: var(--muted); }
  .colophon h2 { margin-top: 9cqh; font-weight: 400; font-size: min(7.4cqw, 4.4cqh); line-height: 1.35; word-break: keep-all; }
  .colophon .by { margin-top: 1.6cqh; font-size: max(11px, min(3.8cqw, 2.3cqh)); color: #4A4540; }
  .colophon .memo { margin-top: 5cqh; font-size: max(11px, min(3.5cqw, 2.1cqh)); line-height: 1.85; color: #3A3632; word-break: keep-all; }
  .colophon dl { margin-top: auto; display: grid; grid-template-columns: auto 1fr; column-gap: 5cqw; row-gap: 1cqh; padding-top: 2.4cqh; border-top: 1px solid #CFC7B8; font-size: max(10px, min(3.2cqw, 1.9cqh)); }
  .colophon dt { color: var(--muted); }
  .colophon .cuts { margin-top: 4cqh; display: flex; align-items: flex-end; gap: 2.4cqw; }
  .colophon .cuts span { font-size: max(10px, min(3.2cqw, 1.9cqh)); color: var(--muted); margin-right: 1cqw; align-self: center; }
  .colophon .cuts button { height: 9cqh; aspect-ratio: var(--ar); background: center / 100% 100% no-repeat; opacity: .7; transition: opacity .2s, transform .2s; }
  .colophon .cuts button:hover { opacity: .8; }
  .colophon .cuts button[aria-pressed="true"] { opacity: 1; transform: translateY(-3px); }
  .colophon .cuts button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .colophon .sw { display: inline-block; width: 1.05em; height: 1.05em; margin-right: .35em; vertical-align: -.15em; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }

  @media (max-width: 760px) {
    .bar, .filters, .caption { padding-left: 18px; padding-right: 18px; }
    .shelf { padding: 30px 18px 0; }
    .baseline { margin: 0 18px; }
    :root { --shelf: min(40vh, 330px); --big: 1.6; --cap: 360; }
    .caption { flex-direction: column; gap: 8px; }
    .caption .cm { display: block; margin: 4px 0 0; }
  }
  /* 전체 목록: 모든 책을 실제 판형 비율대로, 바닥선에 맞춰 한 번에 */
  .index { padding: 90px 28px 120px; --g: calc(min(15vw, 230px) / 220); }
  .index-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; font-size: 15px; }
  .index-head h2 { font-weight: 400; font-size: clamp(28px, 3.8vw, 58px); line-height: 1; letter-spacing: -.01em; }
  .index-head span { color: var(--muted); }
  /* 엇갈린 격자: 한 줄에 5권, 다음 줄은 반 칸 밀려 4권 (JS가 자리를 정한다) */
  .grid { --cols: 10; display: grid; grid-template-columns: repeat(var(--cols), 1fr); row-gap: clamp(36px, 4vw, 64px); padding-top: 50px; }
  .ix { position: relative; display: flex; justify-content: center; align-items: center; }
  .ix[hidden] { display: none; }
  .ix img { display: block; width: calc(var(--g) * var(--w)); max-width: 100%; height: auto; aspect-ratio: var(--w) / var(--h); object-fit: fill;
            background: #1A1614; box-shadow: 0 0 0 1px rgba(255,255,255,.05); transition: transform .3s; }
  .ix:hover img { transform: translateY(-5px); }
  .ix .in { position: absolute; left: 0; right: 0; top: calc(100% + 10px); text-align: center; font-size: 13px; line-height: 1.4; color: var(--muted);
            word-break: keep-all; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .ix:hover .in, .ix:focus-visible .in { opacity: 1; }
  .ix[aria-current="true"] img { box-shadow: 0 0 0 1px var(--text); }
  .ix:focus-visible { outline: none; }
  .ix:focus-visible img { outline: 2px solid var(--text); outline-offset: 5px; }
  .to-top { margin-top: 80px; font-size: 15px; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
  @media (max-width: 1000px) { .grid { --cols: 6; } .index { --g: calc(22vw / 220); } }
  @media (max-width: 560px) {
    .index { padding: 70px 18px 90px; --g: calc(36vw / 220); }
    .grid { --cols: 4; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .vol, .vol .spine, .vol .front, .vbook, .vcover, .viewer { transition: none !important; }
  }

  /* clothing of book: 행택을 크게 걸어 보기 (앞: 정보와 글 / 뒤: 표지) */
  .tagview { position: fixed; inset: 0; z-index: 60; background: rgba(7,3,3,.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .tagview.show { opacity: 1; pointer-events: auto; }
  .tv-bar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 22px 28px; font-size: 15px; }
  .tv-nav { display: flex; gap: 22px; }
  .tv-bar button:hover { text-decoration: underline; text-underline-offset: 4px; }
  .tv-hint { font-size: 13px; color: var(--muted); }
  .bigtag { position: relative; height: min(80vh, 760px); aspect-ratio: 725 / 1222; max-width: 90vw; perspective: 1800px; cursor: pointer;
            transform-origin: 50% 0; animation: swing 1.4s cubic-bezier(.3,.7,.2,1); }
  @keyframes swing { 0% { transform: rotate(5deg); } 40% { transform: rotate(-3deg); } 70% { transform: rotate(1.4deg); } 100% { transform: none; } }
  .bt-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3,.7,.2,1); }
  .bigtag.flip .bt-in { transform: rotateY(180deg); }
  .bt-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 24px 50px rgba(0,0,0,.45); }
  .bt-face::before { content: ""; position: absolute; left: 50%; top: 5.5%; width: 7%; aspect-ratio: 1; border-radius: 50%; background: #070303; transform: translateX(-50%); z-index: 3; }
  .bt-info { background: var(--tc); color: var(--ti); text-align: left; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow-y: auto; padding: 22% 10% 9%; scrollbar-width: thin; }
  .bt-info dl { display: grid; grid-template-columns: auto 1fr; column-gap: 12%; row-gap: 6px; font-size: 14px; line-height: 1.4; }
  .bt-info dt { font-weight: 500; } .bt-info dd { font-weight: 600; word-break: keep-all; }
  .bt-info .sw { display: inline-block; width: 15px; height: 15px; margin-right: 3px; vertical-align: -3px; border: 1px solid currentColor; }
  .bt-info h4 { margin-top: 22px; padding-top: 14px; border-top: 1px solid currentColor; font-weight: 500; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
  .bt-info p { margin-top: 10px; font-family: var(--serif); font-size: 15px; line-height: 1.85; word-break: keep-all; }
  .bt-info blockquote { margin-top: 14px; padding-left: 12px; border-left: 1.5px solid currentColor; font-family: var(--serif); font-size: 13.5px; line-height: 1.8; opacity: .85; word-break: keep-all; }
  .bt-info blockquote cite { display: block; margin-top: 4px; font-style: normal; font-size: 12px; }
  .bt-info table { margin-top: 10px; width: 100%; border-collapse: collapse; font-size: 13px; }
  .bt-info th, .bt-info td { text-align: left; padding: 5px 0; border-bottom: 1px solid currentColor; font-weight: 500; vertical-align: top; }
  .bt-info th { width: 28%; }
  .bt-info img { margin-top: 12px; width: 100%; display: block; }
  .bt-info .ft { margin-top: 22px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; text-align: center; }
  .bt-cover { transform: rotateY(180deg); background: #111 center / cover no-repeat; }
  @media (prefers-reduced-motion: reduce) { .bigtag { animation: none; } .bt-in, .tagview { transition: none; } }

</style>

    const cols = parseInt(getComputedStyle(grid).getPropertyValue('--cols')) || 10;
    const n = cols / 2;
    let row = 1, k = 0;
    visible.forEach(i => {
      const odd = row % 2 === 1, per = odd ? n : n - 1;
      items[i].style.gridRow = row;
      items[i].style.gridColumn = `${(odd ? 1 : 2) + k * 2} / span 2`;
      if (++k >= per) { k = 0; row++; }
    });
  }
  window.addEventListener('resize', layoutGrid);

  // 책장 안에서만 가로로 움직인다 (페이지는 세로로 움직이지 않게)
  function centerShelf(i, smooth = true) {
    const v = vols[i];
    shelf.scrollTo({ left: v.offsetLeft + v.offsetWidth / 2 - shelf.clientWidth / 2, behavior: smooth && !reduce ? 'smooth' : 'auto' });
  }
  function pickFromIndex(i) {
    if (!visible.includes(i)) applyFilter('all', false);
    setMain(i, false);
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    setTimeout(() => { centerShelf(i); vols[i].focus({ preventScroll: true }); }, reduce ? 0 : 720);
  }
  document.getElementById('toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }));

  // 앞표지 책의 배율: --big까지 키우되 첫 화면 높이를 넘지 않게
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;visibility:hidden;height:calc(var(--k) * 1000);width:0';
  document.body.appendChild(probe);
  function fitMain() {
    const b = works[main], k = probe.offsetHeight / 1000;
    const big = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--big')) || 1.9;
    const stage = document.querySelector('.stage'), wrap = document.querySelector('.shelf-wrap');
    const overhead = wrap.offsetTop + (wrap.offsetHeight - shelf.offsetHeight) + 30 + 8; // 위 글자들 + 캡션 + 여백
    const avail = Math.max(window.innerHeight - overhead, k * b.h);
    const sc = Math.max(1, Math.min(big, avail / (k * b.h)));
    vols.forEach((v, j) => j === main ? v.style.setProperty('--s', sc.toFixed(3)) : v.style.removeProperty('--s'));
  }
  window.addEventListener('resize', fitMain);

  function setMain(i, scroll = true) {
    main = i;
    vols.forEach((v, j) => v.classList.toggle('main', j === i));
    fitMain();
    items.forEach((v, j) => v.setAttribute('aria-current', j === i ? 'true' : 'false'));
    const b = works[i];
    document.getElementById('ct').textContent = b.title;
    document.getElementById('cm').textContent = [b.author, b.field].filter(Boolean).join(', ');
    document.getElementById('openMain').textContent = b.tag ? 'read the study' : b.flat ? 'view the poster' : 'open the book';
    if (scroll) setTimeout(() => centerShelf(i), reduce ? 0 : 720);
  }
  function applyFilter(key, pickFirst = true) {
    filters.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.key === key ? 'true' : 'false'));
    visible = works.map((_, i) => i).filter(i => key === 'all' || works[i].type === key);
    vols.forEach((v, i) => v.hidden = !visible.includes(i));
    items.forEach((v, i) => v.hidden = !visible.includes(i));
    layoutGrid();
    const fi = works.findIndex(w => w.id === FEATURED);
    if (pickFirst) setMain(key === 'all' && fi >= 0 ? fi : visible[0]);
    const n = visible.length + (visible.length === 1 ? ' work' : ' works');
    document.getElementById('count').textContent = n + ' ↓';
    document.getElementById('indexCount').textContent = n;
  }
  applyFilter('all');
  document.getElementById('openMain').addEventListener('click', () => openWork(main));

  // 마우스 휠로 책장을 옆으로
  shelf.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    const max = shelf.scrollWidth - shelf.clientWidth;
    const canMove = e.deltaY > 0 ? shelf.scrollLeft < max - 1 : shelf.scrollLeft > 1;
    if (max > 0 && canMove) { shelf.style.scrollBehavior = 'auto'; shelf.scrollLeft += e.deltaY; shelf.style.scrollBehavior = ''; e.preventDefault(); }
  }, { passive: false });

  // 상세
  function fill(i) {
    const b = works[i];
    const DH = Math.min(window.innerHeight * 0.76, window.innerWidth * 0.44 * b.h / b.w);
    vbook.style.cssText = `--w:${b.w}; --h:${b.h}; --DH:${DH}px`;
    // 앞면은 표지, 넘긴 뒤 왼쪽 면은 그 책의 색 한 장
    const plane = (b.palette && b.palette[0]) || b.spineColor;
    const leftImg = b.flat ? `url('${b.cover}')` : 'none';
    vbook.classList.toggle('flat', !!b.flat);
    vfront.style.backgroundImage = `url('${b.cover}')`;
    vback.style.backgroundImage = leftImg;
    vback.style.backgroundColor = plane;
    const rows = [
      ['field', b.field],
      ['publisher', b.publisher],
      ['size', b.approx ? '' : `${b.w} × ${b.h} mm`],
      ['pages', b.pages ? `${b.pages}쪽` : ''],
      ['year', b.year],
      ['finish', b.finish],
      ['tools', b.tools],
      ['colors', (b.palette || []).map(c => `<span class="sw" style="background:${c}"></span>`).join('')],
      ['note', b.note],
    ].filter(r => r[1]);
    colophon.classList.toggle('study', !!b.tag);
    if (b.tag) {
      colophon.innerHTML = `
        <span class="no">study ${pad(works.filter(w => w.tag).indexOf(b) + 1)} / ${pad(works.filter(w => w.tag).length)}, clothing of book</span>
        <p class="des">Designer <b>${esc(b.designer)}</b></p>
        <h2>${esc(b.title)}</h2>
        <p class="memo">${esc(b.memo)}</p>
        ${b.quote ? `<blockquote>“${esc(b.quote)}”<cite>${esc(b.by)}</cite></blockquote>` : ''}
        <dl>${[['page', b.page], ['size', b.sizeText], ['binding', b.binding], ['colors', b.palette.map(c => `<span class="sw" style="background:${c}"></span>`).join('')], ...b.spec.map(([k, v]) => [k, v])]
          .map(([k, v]) => `<dt>${k}</dt><dd>${k === 'colors' ? v : esc(v)}</dd>`).join('')}</dl>
        ${b.spread ? `<img class="spr" src="${b.spread}" alt="${esc(b.title)} 본문 펼침면">` : ''}`;
      colophon.scrollTop = 0;
      return;
    }
    colophon.innerHTML = `
      <span class="no">${b.flat ? 'poster' : 'book design'} ${pad(i + 1)} / ${pad(works.length)}, ${esc(b.type)}</span>
      <h2>${esc(b.title)}</h2>
      ${b.author ? `<p class="by">${esc(b.author)}</p>` : ''}
      ${b.memo ? `<p class="memo" id="memo">${esc(b.memo)}</p>` : ''}
      ${b.alts ? `<div class="cuts" role="group" aria-label="표지 시안"><span>cuts</span>${
        [{ img: b.cover, cap: b.memo }, ...b.alts].map((c, n) =>
          `<button style="--ar:${b.w}/${b.h}; background-image:url('${c.img}')" data-n="${n}" aria-pressed="false" aria-label="${n === 0 ? 'A컷' : 'B컷 ' + n}"></button>`).join('')
      }</div>` : ''}
      <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${k === 'colors' ? v : esc(v)}</dd>`).join('')}</dl>`;
    // 시안을 고르면 왼쪽 표지와 설명이 바뀐다
    if (b.alts) {
      const cuts = [{ img: b.cover, cap: b.memo }, ...b.alts];
      colophon.querySelectorAll('.cuts button').forEach(btn => btn.addEventListener('click', () => {
        const on = btn.getAttribute('aria-pressed') === 'true';
        const c = cuts[+btn.dataset.n];
        vback.style.backgroundImage = on ? (b.flat ? `url('${b.cover}')` : 'none') : `url('${c.img}')`;
        const m = document.getElementById('memo'); if (m) m.textContent = on ? b.memo : c.cap;
        colophon.querySelectorAll('.cuts button').forEach(x => x.setAttribute('aria-pressed', (!on && x === btn) ? 'true' : 'false'));
      }));
    }
  }

  /* clothing of book: 행택 보기 */
  const tagView = document.getElementById('tagView'), bigTag = document.getElementById('bigTag');
  const tagIdx = () => works.map((w, i) => w.tag ? i : -1).filter(i => i >= 0);
  let tagCur = -1;
  function openTag(i) {
    const b = works[i]; tagCur = i;
    bigTag.classList.remove('flip');
    bigTag.style.setProperty('--tc', b.tc); bigTag.style.setProperty('--ti', b.ti);
    bigTag.style.animation = 'none'; void bigTag.offsetWidth; bigTag.style.animation = '';
    document.getElementById('btCover').style.backgroundImage = `url('${b.cover}')`;
    const info = document.getElementById('btInfo');
    info.innerHTML = `<dl><dt>Title</dt><dd>${esc(b.title)}</dd><dt>Designer</dt><dd>${esc(b.designer)}</dd><dt>Page</dt><dd>${esc(b.page)}</dd>
        <dt>Size</dt><dd>${esc(b.sizeText)}</dd><dt>Color</dt><dd>${b.palette.map(c => `<span class="sw" style="background:${c}"></span>`).join('')}</dd><dt>Binding</dt><dd>${esc(b.binding)}</dd></dl>
      <h4>Story</h4><p>${esc(b.memo)}</p>
      ${b.quote ? `<blockquote>“${esc(b.quote)}”<cite>${esc(b.by)}</cite></blockquote>` : ''}
      ${b.spec.length ? `<h4>Typography</h4><table>${b.spec.map(([k, v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('')}</table>` : ''}
      ${b.spread ? `<img src="${b.spread}" alt="${esc(b.title)} 본문 펼침면">` : ''}
      <p class="ft">clothing of book</p>`;
    info.scrollTop = 0;
    tagView.classList.add('show'); tagView.setAttribute('aria-hidden', 'false');
    setTimeout(() => document.getElementById('tvClose').focus({ preventScroll: true }), 150);
  }
  function closeTag() { tagView.classList.remove('show'); tagView.setAttribute('aria-hidden', 'true'); if (vols[tagCur]) vols[tagCur].focus({ preventScroll: true }); }
  bigTag.addEventListener('click', e => { if (e.target.closest('.bt-info') && document.getElementById('btInfo').scrollHeight > document.getElementById('btInfo').clientHeight && window.getSelection().toString()) return; bigTag.classList.toggle('flip'); });
  document.getElementById('tvClose').addEventListener('click', closeTag);
  const tagStep = d => { const ids = tagIdx(), p = ids.indexOf(tagCur); const n = ids[(p + d + ids.length) % ids.length]; setMain(n, false); openTag(n); };
  document.getElementById('tvPrev').addEventListener('click', () => tagStep(-1));
  document.getElementById('tvNext').addEventListener('click', () => tagStep(1));
  tagView.addEventListener('click', e => { if (e.target === tagView) closeTag(); });
  document.addEventListener('keydown', e => {
    if (!tagView.classList.contains('show')) return;
    if (e.key === 'Escape') closeTag(); if (e.key === 'ArrowRight') tagStep(1); if (e.key === 'ArrowLeft') tagStep(-1);
  });

  function openWork(i) {
    if (works[i].tag) return openTag(i);
    current = i; vbook.classList.remove('open'); fill(i);
    viewer.classList.add('show'); viewer.setAttribute('aria-hidden', 'false');
    setTimeout(() => vbook.classList.add('open'), reduce ? 0 : 350);
    document.getElementById('closeV').focus({ preventScroll: true });
  }
  function closeWork() {
    vbook.classList.remove('open');
    setTimeout(() => { viewer.classList.remove('show'); viewer.setAttribute('aria-hidden', 'true'); vols[main].focus({ preventScroll: true }); }, reduce ? 0 : 900);
  }
  function step(d) {
    const pos = visible.indexOf(current);
    const n = visible[(pos + d + visible.length) % visible.length];
    vbook.classList.remove('open');
    setTimeout(() => { current = n; setMain(n, false); fill(n); setTimeout(() => vbook.classList.add('open'), 60); }, reduce ? 0 : 900);
  }
  document.getElementById('closeV').addEventListener('click', closeWork);
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
  viewer.addEventListener('click', e => { if (e.target === viewer) closeWork(); });
  document.addEventListener('keydown', e => {
    if (!viewer.classList.contains('show')) return;
    if (e.key === 'Escape') closeWork();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });

</script>
</body>
</html>
