<style>
  /* 세명조: 이 컴퓨터에 설치돼 있으면 그걸 쓰고,
     fonts 폴더에 웹폰트 파일을 넣으면 모든 방문자에게 세명조로 보입니다. */
  @font-face {
    font-family: "SeMyungjo";
    src: local("SM세명조"), local("SMSeMyungJo"), local("SMSeMyungJo-Regular"),
         local("SM SeMyungJo Std"), local("SMSeMyungJoStd-Regular"),
         url("fonts/SMSeMyungJo.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --bg: #070303;
    --text: #EEEAE2;
    --frame: #221D1D;
    --serif: "SeMyungjo", "EB Garamond", "Nanum Myeongjo", serif;
    /* 일러스트 대지 2410 × 1530 을 화면에 맞춘 단위 */
    --u: min(calc(100vw / 2410), calc(100vh / 1530));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--serif);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .stage {
    position: relative;
    width: calc(var(--u) * 2410);
    height: calc(var(--u) * 1530);
    flex: none;
  }

  /* 제목 */
  .head {
    position: absolute;
    left: calc(var(--u) * 136); right: calc(var(--u) * 148); top: calc(var(--u) * 70);
    display: grid; grid-template-columns: auto 1fr auto;
    column-gap: calc(var(--u) * 68);
    font-weight: 400;
  }
  .head .en { display: block; font-size: calc(var(--u) * 150); line-height: 1; letter-spacing: -.01em; }
  .head .ko { display: block; margin-top: calc(var(--u) * 40); font-size: calc(var(--u) * 106); line-height: 1; letter-spacing: .02em; }
  .head .r { text-align: right; }
  .head .rule { height: calc(var(--u) * 2.5); background: var(--text); margin-top: calc(var(--u) * 90); }

  /* 문틀 */
  .frame {
    position: absolute;
    left: calc(var(--u) * 804); top: calc(var(--u) * 236);
    width: calc(var(--u) * 732); height: calc(var(--u) * 1182);
    border: calc(var(--u) * 2.5) solid var(--frame); border-bottom: 0;
  }

  /* 문(책) 자리 */
  .doorwrap {
    position: absolute;
    left: calc(var(--u) * 899); top: calc(var(--u) * 306);
    width: calc(var(--u) * 564); height: calc(var(--u) * 1145);
    --H: calc(var(--u) * 1145);
  }

  /* ───────── 큰 문 = 책 ───────── */
  .book {
    position: relative; width: 100%; height: 100%;
    perspective: 2400px;
    transition: transform 2.2s cubic-bezier(.45,.05,.2,1);
  }
  .book.open { transform: translateX(50%) scale(.9); }

  /* 문 뒤 페이지 */
  .page {
    position: absolute; inset: 0;
    background: #FBF8F1; color: #1A1A1A;
    container-type: size;
  }
  .page::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 12%;
    background: linear-gradient(90deg, rgba(0,0,0,.10), rgba(0,0,0,0));
  }
  .page-in {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 16cqw 13cqw 10cqw; text-align: center;
  }
  .page-in .small { font-size: max(11px, 3.6cqw); color: #8C8577; }
  .page-in .statement { margin-top: 30cqw; font-size: max(12px, 4.4cqw); line-height: 2; color: #2E2A26; word-break: keep-all; }
  .page-in .sign { margin-top: 10cqw; font-size: max(12px, 4.4cqw); }
  .page-in .close { margin-top: auto; font-size: max(11px, 3.6cqw); border-bottom: 1px solid currentColor; padding-bottom: 2px; }
  .page-in .folio { margin-top: 5cqw; font-size: max(10px, 3.4cqw); color: #8C8577; }

  /* 표지 */
  .cover {
    position: absolute; inset: 0;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 2.2s cubic-bezier(.45,.05,.2,1);
    z-index: 10;
  }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.front { background: #fff; cursor: pointer; }
  a.box { cursor: pointer; }
  .face.back { transform: rotateY(180deg); background: #FBF8F1; container-type: size; }
  .face.back::after {
    content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 12%;
    background: linear-gradient(270deg, rgba(0,0,0,.10), rgba(0,0,0,0));
  }
  .face.back .folio { position: absolute; left: 0; right: 0; bottom: 10cqw; text-align: center; font-size: max(10px, 3.4cqw); color: #8C8577; }
  .face.back .hint { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: max(11px, 3.6cqw); color: #A49C8D; opacity: 0; transition: opacity .4s; }
  .book.peek .cover { transform: rotateY(-30deg); transition: transform 1.2s cubic-bezier(.45,.05,.2,1); }
  .book.open .cover { transform: rotateY(-180deg); }
  .book.open .face.front { pointer-events: none; }
  .book.open .face.back { cursor: pointer; }
  .book.open.lift .cover { transform: rotateY(-158deg); transition: transform .7s cubic-bezier(.3,.7,.2,1); }
  .book.open.lift .face.back .hint { opacity: 1; }

  /* 손잡이: 검정 동그라미 */
  .knob {
    position: absolute;
    top: calc(463 / 1145 * 100%);
    width: calc(34 / 564 * 100%); aspect-ratio: 1;
    border-radius: 50%; background: #0B0808;
    z-index: 20;
    transition: transform .3s;
  }
  .face.front .knob { left: calc(472 / 564 * 100%); }
  .face.back .knob { left: calc(58 / 564 * 100%); background: #C9C1B2; }
  .knob::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; }
  .face.front .knob:hover { transform: scale(1.15); }
  .knob:focus-visible, .close:focus-visible { outline: 2px solid #1A1A1A; outline-offset: 4px; }

  /* ───────── 문 위의 색면들. 좌표는 문 크기 564 × 1145 기준 ───────── */
  .box {
    position: absolute;
    left:   calc(var(--x) / 564 * 100%);
    top:    calc(var(--y) / 1145 * 100%);
    width:  calc(var(--w) / 564 * 100%);
    height: calc(var(--h) / 1145 * 100%);
    background: var(--c);
  }
  a.box { background: none; outline: none; z-index: 1; }
  a.box:hover, a.box:focus-visible, a.box.active { z-index: 5; }
  .room-in {
    position: absolute; inset: 0; overflow: hidden;
    background: var(--in); clip-path: inset(1px);
    container-type: size;
  }
  a.box:hover .room-in, a.box:focus-visible .room-in, a.box.active .room-in { clip-path: none; }
  .room-in b {
    position: absolute; left: 10cqw; top: 7cqh;
    font-weight: 400;
    font-size: clamp(11px, calc(var(--H) * .019), 16px);
    line-height: 1.2;
    color: var(--label, #F6F2EA);
  }
  .leaf {
    position: absolute; inset: 0;
    background: var(--c);
    transform-origin: left center;
    transition: transform .6s cubic-bezier(.5,0,.2,1);
    z-index: 2;
  }
  a.box:hover .leaf, a.box:focus-visible .leaf, a.box.active .leaf { transform: scaleX(-.14) skewY(-10deg); }
  a.box:focus-visible .room-in { outline: 2px solid #1A1A1A; outline-offset: 3px; }

  /* 세로 화면(휴대폰) */
  @media (max-aspect-ratio: 4/5) {
    body { overflow: auto; align-items: flex-start; }
    .stage { width: 100vw; height: auto; min-height: 100vh; padding: 28px 18px 40px; }
    .head { position: static; column-gap: 12px; }
    .head .en { font-size: 9.5vw; }
    .head .ko { font-size: 6.6vw; margin-top: 6px; }
    .head .rule { margin-top: 5.5vw; height: 1px; }
    .frame { display: none; }
    .doorwrap {
      position: relative; left: auto; top: auto;
      margin: 9vh auto 0;
      width: 44vw; height: calc(44vw * 1145 / 564);
      --H: calc(44vw * 1145 / 564);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .book, .cover, .leaf { transition: none !important; }
  }
</style>

<body>
<div class="stage">

  <header class="head">
    <div class="l"><span class="en">book is</span><span class="ko">책은</span></div>
    <i class="rule" aria-hidden="true"></i>
    <div class="r"><span class="en">open door</span><span class="ko">열린 문이다</span></div>
  </header>

  <div class="frame" aria-hidden="true"></div>

  <div class="doorwrap">
    <div class="book" id="book">

      <!-- 문을 열면 보이는 페이지 -->
      <div class="page" id="statement" aria-hidden="true">
        <div class="page-in">
          <span class="small">4inching press, book design</span>
          <p class="statement">표지는 문짝이고 판형은 문틀입니다.<br>한 권의 책에 꼭 맞는 문을 짓고,<br>누군가 그 문을 열고 들어가<br>자기 자리를 찾게 하는 일을 합니다.</p>
          <span class="sign">사인칭 북디자인</span>
          <button class="close" id="close" tabindex="-1">close the book</button>
          <span class="folio">一</span>
        </div>
      </div>

      <!-- 큰 문(표지) -->
      <div class="cover" id="cover">
        <div class="face back" id="backface" aria-hidden="true">
          <button class="knob" id="knobBack" aria-label="책 덮기" tabindex="-1"></button>
          <span class="hint">click to close</span>
          <span class="folio">〇</span>
        </div>
        <div class="face front door" id="frontface" aria-label="색면으로 된 문">
          <button class="knob" id="knob" aria-label="큰 문 열기"></button>

          <!-- 장식 -->
          <div class="box" style="--x:75; --y:67; --w:136; --h:37; --c:#42BFEC"></div>

          <!-- 문이 되는 색면: 링크와 이름만 바꾸면 됩니다 -->
          <a class="box" href="sainching/" aria-label="4inching press"
             style="--x:354; --y:67; --w:158; --h:220; --c:#F4C9DC; --in:#2B2440">
            <span class="room-in"><b>4inching<br>press</b></span><span class="leaf"></span>
          </a>
          <a class="box" href="book/" aria-label="book, 책을 해체하라"
             style="--x:70; --y:432; --w:167; --h:96; --c:#F5CE8E; --in:#42BFEC; --label:#1D2A4A">
            <span class="room-in"><b>book</b></span><span class="leaf"></span>
          </a>
          <a class="box" href="design/" aria-label="book design"
             style="--x:75; --y:730; --w:72; --h:357; --c:#B92D55; --in:#F3E6DC; --label:#B92D55">
            <span class="room-in"><b>book<br>design</b></span><span class="leaf"></span>
          </a>
          <a class="box" href="booktailor/" aria-label="booktailor shop"
             style="--x:262; --y:730; --w:254; --h:356; --c:#1C776A; --in:#F3E6DC; --label:#1C776A">
            <span class="room-in"><b>booktailor<br>shop</b></span><span class="leaf"></span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const book = document.getElementById('book');
  const knob = document.getElementById('knob');
  const knobBack = document.getElementById('knobBack');
  const closeBtn = document.getElementById('close');
  const backface = document.getElementById('backface');
  const statement = document.getElementById('statement');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = window.matchMedia('(hover: none)').matches;
  const boxes = document.querySelectorAll('a.box');

  function openDoor() {
    book.classList.remove('peek'); book.classList.add('open');
    statement.setAttribute('aria-hidden', 'false');
    closeBtn.tabIndex = 0; knobBack.tabIndex = 0; knob.tabIndex = -1;
    boxes.forEach(b => b.tabIndex = -1);
  }
  function closeDoor() {
    book.classList.remove('open', 'lift');
    statement.setAttribute('aria-hidden', 'true');
    closeBtn.tabIndex = -1; knobBack.tabIndex = -1;
    knob.removeAttribute('tabindex');
    boxes.forEach(b => b.removeAttribute('tabindex'));
    knob.focus({ preventScroll: true });
  }

  // 처음 들어오면 문이 한 번 살짝 열렸다 닫힌다
  let seen = false;
  try { seen = sessionStorage.getItem('peeked') === '1'; sessionStorage.setItem('peeked', '1'); } catch (e) {}
  if (!reduce && !seen) {
    setTimeout(() => book.classList.add('peek'), 800);
    setTimeout(() => book.classList.remove('peek'), 2000);
  }

  knob.addEventListener('mouseenter', () => { if (!book.classList.contains('open')) book.classList.add('peek'); });
  knob.addEventListener('mouseleave', () => book.classList.remove('peek'));
  knob.addEventListener('click', e => { e.stopPropagation(); openDoor(); });
  // 흰 문 어디를 눌러도 열린다 (색면 문은 각자의 방으로)
  const frontface = document.getElementById('frontface');
  frontface.addEventListener('click', e => {
    if (e.target.closest('a.box')) return;
    if (!book.classList.contains('open')) openDoor();
  });
  closeBtn.addEventListener('click', closeDoor);
  knobBack.addEventListener('click', e => { e.stopPropagation(); closeDoor(); });
  backface.addEventListener('mouseenter', () => { if (book.classList.contains('open')) book.classList.add('lift'); });
  backface.addEventListener('mouseleave', () => book.classList.remove('lift'));
  backface.addEventListener('click', () => { if (book.classList.contains('open')) closeDoor(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && book.classList.contains('open')) closeDoor(); });

  // 터치 화면: 작은 문은 첫 탭에 열리고 두 번째 탭에 들어간다
  if (touch) {
    boxes.forEach(box => box.addEventListener('click', e => {
      if (!box.classList.contains('active')) {
        e.preventDefault();
        boxes.forEach(b => b.classList.remove('active'));
        box.classList.add('active');
      }
    }));
    document.addEventListener('click', e => { if (!e.target.closest('a.box')) boxes.forEach(b => b.classList.remove('active')); });
  }
  window.addEventListener('pageshow', () => boxes.forEach(b => b.classList.remove('active')));
</script>
</body>
</html>
